<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek 的浏览器</title>
<style>
body{font:15px system-ui,sans-serif;background:#eef4fa;color:#243b57;margin:0}main{max-width:1120px;margin:24px auto;padding:0 18px}h1{font-size:24px;margin-bottom:6px}.hint{color:#60738c;line-height:1.7}button,input,select{font:inherit;padding:9px 13px;border:1px solid #b7c9de;border-radius:9px;background:white}button{cursor:pointer}button:hover{background:#deecfc}button:disabled{opacity:.45;cursor:default}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input{flex:1;min-width:220px}#screen{width:100%;border-radius:12px;background:white;min-height:180px;box-shadow:0 6px 30px #28456718}#error{color:#a03b39;min-height:22px}#title{font-weight:600}#url{overflow-wrap:anywhere;color:#60738c}#badge{background:#dce9f7;padding:6px 12px;border-radius:20px;font-size:14px}a{color:#225ea5}
</style>
<main><h1>DeepSeek 的浏览器 <span id="badge">连接中</span></h1>
<div class="hint">她自己的浏览空间。页面约每 2 秒更新；接管后可以点击页面、滚动和打开链接。关闭此窗口不会替你切换模式。</div>
<div class="bar"><button data-action="auto">让她自己逛</button><button data-action="pause">暂停</button><button data-action="manual">我来接管</button></div>
<div id="title">等待页面</div><div id="url"></div>
<div class="bar"><select id="seed" aria-label="科普站点"></select><button id="openSeed" class="manual">打开</button><button id="back" class="manual">返回上一页</button></div>
<div class="bar"><input id="address" placeholder="输入获准站点的 HTTPS 地址" aria-label="网页地址"><button id="go" class="manual">前往</button><button id="up" class="manual">向上</button><button id="down" class="manual">向下</button></div>
<div id="error" role="status"></div><img id="screen" alt="独立浏览器的实际页面截图">
<p class="hint">第一版开放维基百科、NASA、NOAA 的公开页面。暂不支持登录、上传、下载、发表内容或播放音视频。这里展示的页面来自她的浏览器，不是你的电脑屏幕。</p></main>
<script>
let state=null, working=false, imageURL=null;
const el=id=>document.getElementById(id);
async function request(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-Browser-Control':'1'}:{},body:body?JSON.stringify(body):undefined});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(r.status===401?'请从桌宠的“她的浏览器”重新打开。':d.error||'连接未完成，请稍后再试。')}return r}
async function refresh(){try{state=await (await request('status')).json();el('badge').textContent={auto:'她在自主浏览',pause:'已暂停',manual:'由你接管'}[state.mode]+(state.busy?' · 正在打开页面':'');el('title').textContent=state.title;el('url').textContent=state.url;document.querySelectorAll('.manual').forEach(b=>b.disabled=state.mode!=='manual'||working);if(!el('seed').options.length)state.seeds.forEach(url=>{let o=document.createElement('option');o.value=url;o.textContent=decodeURI(url);el('seed').append(o)});const blob=await(await request('screenshot')).blob();if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(blob);el('screen').src=imageURL;}catch(e){el('error').textContent=e.message}}
async function act(action,extra={}){if(!state)return;try{working=true;el('error').textContent='';await request('control',{action,version:state.version,...extra})}catch(e){el('error').textContent=e.message}finally{working=false;await refresh()}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));
el('go').onclick=()=>act('visit',{url:el('address').value.trim()});el('openSeed').onclick=()=>act('visit',{url:el('seed').value});el('back').onclick=()=>act('back');el('up').onclick=()=>act('scroll',{delta:-550});el('down').onclick=()=>act('scroll',{delta:550});
el('screen').onclick=e=>{if(state?.mode!=='manual'||working)return;const r=e.target.getBoundingClientRect();act('click',{x:Math.min(1099,Math.max(0,Math.floor((e.clientX-r.left)*1100/r.width))),y:Math.min(699,Math.max(0,Math.floor((e.clientY-r.top)*700/r.height)))})};
async function poll(){await refresh();setTimeout(poll,2000)}poll();
</script></html>
