# Installed as /opt/dafeiyu/compose.yaml. Browser is opt-in on a 2 GiB host.
name: dafeiyu-cloud
services:
  core:
    build: .
    image: little-blue-core:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DAFEIYU_CORE_PORT:-8765}:8765"
    env_file:
      - path: .env
        required: false
    environment:
      LITTLE_BLUE_DATA_DIR: /data
      TZ: America/New_York
      LITTLE_BLUE_EMBEDDING_MODEL_DIR: /models/bge-small-zh-v1.5
      LITTLE_BLUE_BROWSER_URL: ${DAFEIYU_BROWSER_URL:-}
    volumes:
      - core-data:/data
      - ./assets/memes:/app/assets/memes:ro
      - ./models:/models:ro
    secrets: [core_token, browser_token, bridge_token]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    memswap_limit: 1536m
    cpus: 1.5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  browser:
    profiles: [browser]
    build: ./browser_service
    image: little-blue-browser:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DAFEIYU_BROWSER_PORT:-8766}:8080"
    volumes: ["browser-data:/browser"]
    secrets: [browser_token]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    shm_size: 128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true", "seccomp=./browser_service/seccomp_profile.json"]
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  core-data:
  browser-data:
secrets:
  core_token: {file: ./.secrets/core_token}
  browser_token: {file: ./.secrets/browser_token}
  bridge_token: {file: ./.secrets/bridge_token}
