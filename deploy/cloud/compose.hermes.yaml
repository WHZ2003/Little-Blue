# Apply after compose.yaml and the existing handoff compose.override.yaml.
services:
  core:
    environment:
      LITTLE_BLUE_HERMES_URL: http://hermes:8787
    secrets: [core_token, browser_token, bridge_token, hermes_token]
    networks: [default, hermes-private]
  hermes:
    image: dafeiyu-hermes:55ee4ac-final
    init: true
    restart: unless-stopped
    environment:
      HERMES_HOME: /data/hermes
      DAFEIYU_PROXY_URL: http://core:8765/harness
    volumes: ["core-data:/data"]
    secrets: [hermes_token]
    networks: [hermes-private]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
secrets:
  hermes_token: {file: ./.secrets/hermes_token}
networks:
  hermes-private:
    internal: true
